name: CI - pricing-service

on:
  # Pas de filtre "paths" sur les PR : sinon les checks obligatoires
  # ne se lancent pas et la PR reste bloquee en attente.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'apps/pricing-service/**'
      - '.github/workflows/ci-pricing.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/pricing-service

defaults:
  run:
    working-directory: apps/pricing-service

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/pricing-service/requirements-dev.txt

      - name: Installer les dependances
        run: python -m pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: python -m pytest --junitxml=build/test-results/pytest.xml

      - name: Envoyer les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: apps/pricing-service/build/test-results/
          retention-days: 7

  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/pricing-service/requirements-dev.txt

      - name: Installer les dependances
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff check
        run: python -m ruff check app tests

      - name: Ruff format
        run: python -m ruff format --check app tests

  image:
    name: Python Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [tests, quality]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion a GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le nom de l'image doit etre en minuscules, metadata-action s'en occupe
      - name: Tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: apps/pricing-service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
