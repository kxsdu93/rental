name: CI - car-rental-service

on:
  # Pas de filtre "paths" sur les PR : sinon les checks obligatoires
  # ne se lancent pas et la PR reste bloquee en attente.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'apps/car-rental-service/**'
      - '.github/workflows/ci-car-rental.yml'

# Droits minimum par defaut, le job image en demande plus
permissions:
  contents: read

# Annule l'execution precedente si on repousse sur la meme branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/car-rental-service

defaults:
  run:
    working-directory: apps/car-rental-service

jobs:
  tests:
    name: Java tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Lancer les tests
        run: ./gradlew test

      - name: Envoyer les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            apps/car-rental-service/build/test-results/
            apps/car-rental-service/build/reports/tests/
          retention-days: 7

  quality:
    name: Java quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Lancer Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Envoyer les rapports Checkstyle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-checkstyle-reports
          path: apps/car-rental-service/build/reports/checkstyle/
          retention-days: 7

  image:
    name: Java Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [tests, quality]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # On se connecte au registre seulement sur main
      - name: Connexion a GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le nom de l'image doit etre en minuscules, metadata-action s'en occupe
      - name: Tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Sur une PR l'image est construite mais jamais publiee
      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: apps/car-rental-service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
